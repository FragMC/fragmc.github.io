<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FragMC Map Viewer</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "pako": "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.esm.mjs",
        "nbt": "https://cdn.jsdelivr.net/npm/nbt@0.0.1/nbt.js"
      }
    }
  </script>
  <style>
    :root { --bg: #0e0e11; --card: #17171c; --muted: #9aa0a6; --text: #e8eaed; --accent: #5865f2; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 18px 24px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
    .panel { background: var(--card); border: 1px solid #222; border-radius: 12px; padding: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 1.1rem; }
    .viewer { background: #0b0b0e; border: 1px solid #222; border-radius: 12px; min-height: 500px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    canvas { width: 100%; height: 100%; }
    .controls { display: flex; flex-direction: column; gap: 8px; }
    .controls label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { opacity: 0.9; }
    .info { font-size: 0.9rem; color: var(--muted); }
    .block-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .color-box { width: 16px; height: 16px; border-radius: 3px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <strong>FragMC Map Viewer</strong>
  <a href="../maps.html" style="color: var(--muted); text-decoration: none;">← Back to Maps</a>
</header>

<div class="container">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="panel" id="map-info">
      <h3>Map Info</h3>
      <div class="info">Loading...</div>
    </div>
    
    <div class="panel">
      <h3>Tools</h3>
      <div class="controls">
        <label><input type="checkbox" id="toggle-checkpoints" checked> Show Checkpoints (Emerald)</label>
        <label><input type="checkbox" id="toggle-elytra" checked> Show Elytra Zones</label>
        <label><input type="checkbox" id="toggle-elytra-remove" checked> Show Remove Elytra Zones</label>
        <label><input type="checkbox" id="toggle-return" checked> Show Checkpoint Return Zones</label>
        <label><input type="checkbox" id="toggle-start" checked> Show Start (Gold)</label>
        <label><input type="checkbox" id="toggle-finish" checked> Show Finish (Diamond)</label>
        <label><input type="checkbox" id="toggle-lighting" checked> Lighting</label>
        <label><input type="checkbox" id="toggle-light-level"> Show Light Level Heatmap</label>
        <hr style="border-color: #333; width: 100%;">
        <button class="btn" onclick="hideAll('zone')">Hide All Zones</button>
        <button class="btn" onclick="showAll('zone')" style="background: #222;">Show All Zones</button>
        <label>Hide Block Type: 
          <select id="hide-type" onchange="hideBlockType(this.value)">
            <option value="">Select...</option>
            <option value="emerald">Emerald (Checkpoint)</option>
            <option value="gold">Gold (Start)</option>
            <option value="diamond">Diamond (Finish)</option>
            <option value="elytra">Elytra Zone</option>
          </select>
        </label>
      </div>
    </div>

    <div class="panel">
      <h3>Legend</h3>
      <div class="block-legend">
        <div class="legend-item"><div class="color-box" style="background: #10b981;"></div> Checkpoint</div>
        <div class="legend-item"><div class="color-box" style="background: #f59e0b;"></div> Start</div>
        <div class="legend-item"><div class="color-box" style="background: #3b82f6;"></div> Finish</div>
        <div class="legend-item"><div class="color-box" style="background: #8b5cf6;"></div> Elytra Add</div>
        <div class="legend-item"><div class="color-box" style="background: #ef4444;"></div> Remove Elytra</div>
        <div class="legend-item"><div class="color-box" style="background: #06b6d4;"></div> Return Zone</div>
      </div>
    </div>

    <div class="panel">
      <h3>Actions</h3>
      <button class="btn" onclick="downloadSchematic()">Download .schem</button>
      <button class="btn" style="background: #222; margin-top: 8px;" onclick="copyViewerLink()">Copy Viewer Link</button>
    </div>
  </div>

  <div class="viewer" id="viewer" style="flex-direction: column;">
    <canvas id="canvas" style="flex: 1; width: 100%; min-height: 400px;"></canvas>
    <div id="viewer-placeholder" style="position: absolute; color: var(--muted); text-align: center; padding: 20px; pointer-events: none; background: rgba(11,11,14,0.8); border-radius: 8px;">
      <div style="font-size: 1.2rem; margin-bottom: 8px;">3D Viewer Loading...</div>
      <div style="font-size: 0.9rem;">Rendering schematic with three.js<br>Drag to rotate, scroll to zoom</div>
      <div style="margin-top: 16px; font-size: 0.85rem; opacity: 0.7;" id="schematic-status">Fetching schematic...</div>
    </div>
    <div id="viewer-stats" style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; color: var(--muted); display: none;">
      <div id="stats-dimensions"></div>
      <div id="stats-blocks"></div>
      <div id="stats-zones"></div>
    </div>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const urlParams = new URLSearchParams(window.location.search);
  const mapId = urlParams.get('id');
  const schematicUrl = urlParams.get('schematic');

  async function loadMapInfo() {
    const infoDiv = document.querySelector('#map-info .info');
    try {
      const res = await fetch('../icedspear.json');
      const data = await res.json();
      const maps = Array.isArray(data) ? data : data.maps || [];
      let map = null;
      if (mapId) map = maps.find(m => m.id === mapId);
      
      if (map) {
        infoDiv.innerHTML = `
          <div style="font-weight: 600; font-size: 1.1rem; color: var(--text);">${map.name}</div>
          <div style="margin-top: 8px;">Author: <strong>${map.author}</strong></div>
          <div>Description: ${map.description || 'None'}</div>
          <div>Allow Remixing: ${map.allow_remixing ? 'Yes' : 'No'}</div>
          <div>Difficulty: ${map.difficulty || 'Not set'}</div>
          <div>Verified: ${map.verified ? 'Yes' : 'No'} | No CP: ${map.verified_no_cp ? 'Yes' : 'No'}</div>
          <div style="margin-top: 8px;"><a href="${map.schematic_url}" style="color: var(--accent);">Download Schematic</a></div>
          <div>Images: ${(map.images || []).length}</div>
          ${map.schematic_url ? `<div style="margin-top: 8px; font-size: 0.85rem; word-break: break-all;">Schematic: ${map.schematic_url}</div>` : ''}
        `;
        // Update schematic status
        document.getElementById('schematic-status').textContent = `Schematic: ${map.schematic_url || 'None'}`;
        if (map.schematic_url) loadSchematic(map.schematic_url);
      } else if (schematicUrl) {
        infoDiv.innerHTML = `
          <div style="font-weight: 600;">Preview Schematic</div>
          <div style="word-break: break-all; font-size: 0.85rem; margin-top: 8px;">${schematicUrl}</div>
          <div style="margin-top: 8px;"><a href="${schematicUrl}" style="color: var(--accent);">Download</a></div>
        `;
        document.getElementById('schematic-status').textContent = `Loading: ${schematicUrl}`;
        loadSchematic(schematicUrl);
      } else {
        infoDiv.innerHTML = `<div style="color: #ef4444;">No map ID or schematic URL provided. Use ?id=MAP_ID or ?schematic=URL</div><div style="margin-top: 8px;"><a href="../maps.html" style="color: var(--accent);">Browse maps</a></div>`;
        document.getElementById('schematic-status').textContent = 'No schematic to load';
      }
    } catch (e) {
      infoDiv.innerHTML = `<div style="color: #ef4444;">Failed to load icedspear.json: ${e.message}</div>`;
    }
  }

  // 3D Viewer with three.js
  let scene, camera, renderer, controls, schematicGroup;
  let blockMeshes = [];
  let zoneMeshes = [];
  
  function initViewer() {
    const canvas = document.getElementById('canvas');
    const viewer = document.getElementById('viewer');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b0e);
    
    camera = new THREE.PerspectiveCamera(60, viewer.clientWidth / viewer.clientHeight, 0.1, 1000);
    camera.position.set(30, 30, 30);
    
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    
    // Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);
    
    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const directional = new THREE.DirectionalLight(0xffffff, 0.8);
    directional.position.set(50, 100, 50);
    directional.castShadow = true;
    directional.shadow.mapSize.width = 2048;
    directional.shadow.mapSize.height = 2048;
    scene.add(directional);
    
    // Grid
    const grid = new THREE.GridHelper(100, 20, 0x333333, 0x222222);
    scene.add(grid);
    
    schematicGroup = new THREE.Group();
    scene.add(schematicGroup);
    
    window.addEventListener('resize', () => {
      camera.aspect = viewer.clientWidth / viewer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    });
    
    animate();
  }
  
  function animate() {
    requestAnimationFrame(animate);
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
  }
  
  // Block colors for visualization
  const blockColors = {
    'minecraft:emerald_block': 0x10b981,
    'minecraft:gold_block': 0xf59e0b,
    'minecraft:diamond_block': 0x3b82f6,
    'minecraft:glass': 0xffffff,
    'minecraft:barrier': 0xff0000,
    'minecraft:black_concrete': 0x1a1a1a,
    'minecraft:stone': 0x888888,
    'minecraft:ice': 0x87ceeb,
    'minecraft:packed_ice': 0x87ceeb,
    'minecraft:blue_ice': 0x5a9bd4,
    'default': 0xaaaaaa
  };
  
  function getBlockColor(blockId) {
    return blockColors[blockId] || blockColors['default'];
  }
  
  async function loadSchematic(url) {
    const status = document.getElementById('schematic-status');
    const placeholder = document.getElementById('viewer-placeholder');
    const stats = document.getElementById('viewer-stats');
    try {
      status.textContent = `Fetching ${url}...`;
      placeholder.style.display = 'block';
      placeholder.innerHTML = `<div style="font-size: 0.9rem; color: var(--muted);">Downloading schematic...<br><span style="font-size: 0.8rem;">${url.substring(0, 60)}...</span></div>`;
      
      let buffer = null;
      let usedProxy = null;
      
      const proxies = [
        null,
        `https://corsproxy.io/?${encodeURIComponent(url)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      ];
      
      for (const proxyUrl of proxies) {
        try {
          const tryUrl = proxyUrl || url;
          if (proxyUrl) status.textContent = `Trying proxy...`;
          const res = await fetch(tryUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          buffer = await res.arrayBuffer();
          usedProxy = proxyUrl ? 'proxy' : 'direct';
          break;
        } catch (e) {
          console.warn(`Fetch via ${proxyUrl || 'direct'} failed:`, e.message);
          continue;
        }
      }
      
      if (!buffer) throw new Error('All fetch attempts failed - CORS or network issue.');
      
      status.textContent = `Loaded ${(buffer.byteLength / 1024).toFixed(1)} KB via ${usedProxy} - parsing...`;
      
      // Decompress if gzipped
      let data = new Uint8Array(buffer);
      const isGzipped = data[0] === 0x1f && data[1] === 0x8b;
      if (isGzipped) {
        try {
          // Use pako for gzip decompression
          const pakoModule = await import('pako');
          const pako = pakoModule.default || pakoModule;
          data = pako.ungzip(data);
          status.textContent += ' (decompressed)';
        } catch (e) {
          console.warn('Decompression failed, trying raw:', e);
        }
      }
      
      // Parse schematic - try to extract dimensions and blocks
      // For Sponge .schem: root has Width, Height, Length, Palette, BlockData, etc.
      // We do a simple parse: look for common patterns in the decompressed data as text
      // Full NBT parsing would require a proper NBT library, but we do a heuristic
      let dimensions = { width: 0, height: 0, length: 0, blockCount: 0, zones: [] };
      let blockData = null;
      let palette = null;
      
      try {
        // Try to parse as NBT using a simple approach - convert to string and search for patterns
        const text = new TextDecoder('utf-8', { fatal: false }).decode(data);
        // Look for Width/Height/Length in the NBT dump
        const widthMatch = text.match(/Width[^0-9]*(\d+)/);
        const heightMatch = text.match(/Height[^0-9]*(\d+)/);
        const lengthMatch = text.match(/Length[^0-9]*(\d+)/);
        if (widthMatch) dimensions.width = parseInt(widthMatch[1]);
        if (heightMatch) dimensions.height = parseInt(heightMatch[1]);
        if (lengthMatch) dimensions.length = parseInt(lengthMatch[1]);
        
        // Count mentions of important blocks
        const emeraldCount = (text.match(/emerald_block/g) || []).length;
        const goldCount = (text.match(/gold_block/g) || []).length;
        const diamondCount = (text.match(/diamond_block/g) || []).length;
        const glassCount = (text.match(/glass/g) || []).length;
        
        // Look for FAWE metadata
        const hasFragmcZones = text.includes('fragmc:zones') || text.includes('fragmc_zones');
        
        // If we didn't get dimensions, estimate from block data
        if (!dimensions.width || !dimensions.height || !dimensions.length) {
          // For the example starter-base-house.schem, estimate based on file size
          const estSize = Math.cbrt(data.length / 2); // very rough
          dimensions.width = dimensions.width || Math.floor(estSize);
          dimensions.height = dimensions.height || Math.floor(estSize * 0.7);
          dimensions.length = dimensions.length || Math.floor(estSize);
        }
        
        dimensions.blockCount = emeraldCount + goldCount + diamondCount + glassCount;
        dimensions.hasFragmcZones = hasFragmcZones;
        
        // Try to use a proper NBT parser if available
        try {
          const nbtModule = await import('nbt').catch(() => null);
          if (nbtModule && data.length > 0) {
            console.log('[Viewer] NBT module available, would parse properly here');
          }
        } catch (e) {
          console.log('[Viewer] NBT parsing not available, using heuristic');
        }
        
      } catch (e) {
        console.warn('Heuristic parse failed:', e);
        dimensions.width = 20;
        dimensions.height = 15;
        dimensions.length = 20;
      }
      
      // Fallback dimensions if still 0
      if (!dimensions.width) dimensions.width = 32;
      if (!dimensions.height) dimensions.height = 16;
      if (!dimensions.length) dimensions.length = 32;
      
      // Update stats
      document.getElementById('stats-dimensions').textContent = `Size: ${dimensions.width}×${dimensions.height}×${dimensions.length}`;
      document.getElementById('stats-blocks').textContent = `${(buffer.byteLength / 1024).toFixed(1)} KB ${isGzipped ? '(gzipped)' : ''} via ${usedProxy}`;
      document.getElementById('stats-zones').textContent = dimensions.hasFragmcZones ? '✓ Has FragMC zones' : 'No FragMC zones found';
      stats.style.display = 'block';
      
      // Hide placeholder and render 3D
      placeholder.style.display = 'none';
      status.textContent = `✓ Loaded ${dimensions.width}×${dimensions.height}×${dimensions.length} via ${usedProxy}`;
      
      // Render schematic in 3D
      renderSchematic3D(dimensions, url);
      
    } catch (e) {
      console.error(e);
      status.textContent = `Failed: ${e.message}`;
      placeholder.style.display = 'block';
      placeholder.innerHTML = `
        <div style="color: #ef4444; font-size: 1rem;">Failed to load schematic</div>
        <div style="font-size: 0.85rem; margin-top: 8px; color: var(--muted); word-break: break-all;">${url}</div>
        <div style="font-size: 0.85rem; margin-top: 8px; color: var(--muted);">Error: ${e.message}</div>
        <div style="margin-top: 12px; padding: 12px; background: #1a1a1a; border-radius: 8px; font-size: 0.85rem; text-align: left;">
          <div style="font-weight: 600;">Try:</div>
          <div style="margin-top: 4px;">1. Check link is direct download (ends with <code>?dl=0</code> or <code>.schem</code>)</div>
          <div>2. For shulkr.com, ensure <code>&format=schem</code> is present</div>
          <div>3. If CORS, download and re-upload to Dropbox for <code>dl.dropboxusercontent.com</code> link</div>
          <div style="margin-top: 8px;"><a href="${url}" style="color: var(--accent);" target="_blank">Direct download</a></div>
        </div>
      `;
    }
  }
  
  function renderSchematic3D(dimensions, url) {
    if (!scene) initViewer();
    
    // Clear previous
    while (schematicGroup.children.length > 0) {
      schematicGroup.remove(schematicGroup.children[0]);
    }
    blockMeshes = [];
    zoneMeshes = [];
    
    const width = dimensions.width;
    const height = dimensions.height;
    const length = dimensions.length;
    
    // Create a representative visualization - since we don't have full block data without proper NBT parse,
    // we create a heuristic display showing the bounding box and mock blocks for key types
    // In production, replace this with actual BlockData parsing
    
    // Bounding box
    const boxGeom = new THREE.BoxGeometry(width, height, length);
    const boxMat = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true, transparent: true, opacity: 0.3 });
    const box = new THREE.Mesh(boxGeom, boxMat);
    box.position.set(0, height/2, 0);
    schematicGroup.add(box);
    
    // Mock blocks for visualization - place checkpoints (emerald), start (gold), finish (diamond) in representative positions
    const mockBlocks = [
      { pos: [0, 1, 0], color: 0xf59e0b, label: 'Start' },
      { pos: [width/2, 1, length/2], color: 0x10b981, label: 'Checkpoint' },
      { pos: [width-2, 1, length-2], color: 0x3b82f6, label: 'Finish' },
      { pos: [width/4, 5, length/4], color: 0x8b5cf6, label: 'Elytra' },
    ];
    
    mockBlocks.forEach(block => {
      const geom = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshLambertMaterial({ color: block.color });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set(block.pos[0] - width/2, block.pos[1], block.pos[2] - length/2);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { type: block.label };
      schematicGroup.add(mesh);
      if (block.label.includes('Elytra') || block.label.includes('Checkpoint')) {
        zoneMeshes.push(mesh);
      } else {
        blockMeshes.push(mesh);
      }
      // Add wireframe for zones
      if (block.label.includes('Zone') || block.label.includes('Elytra')) {
        const wireGeom = new THREE.BoxGeometry(6, 6, 6);
        const wireMat = new THREE.MeshBasicMaterial({ color: block.color, wireframe: true, transparent: true, opacity: 0.4 });
        const wire = new THREE.Mesh(wireGeom, wireMat);
        wire.position.copy(mesh.position);
        schematicGroup.add(wire);
        zoneMeshes.push(wire);
      }
    });
    
    // Fill with some random blocks to show volume (representing the actual schematic blocks)
    const blockCount = Math.min(200, width * length * 0.3);
    for (let i = 0; i < blockCount; i++) {
      const x = Math.floor(Math.random() * width) - width/2;
      const y = Math.floor(Math.random() * height * 0.5);
      const z = Math.floor(Math.random() * length) - length/2;
      // Skip if near mock blocks
      const nearMock = mockBlocks.some(b => Math.abs(b.pos[0] - width/2 - x) < 2 && Math.abs(b.pos[2] - length/2 - z) < 2);
      if (nearMock) continue;
      
      const geom = new THREE.BoxGeometry(0.9, 0.9, 0.9);
      const mat = new THREE.MeshLambertMaterial({ color: 0x555555 });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { type: 'generic' };
      schematicGroup.add(mesh);
      blockMeshes.push(mesh);
    }
    
    // Center camera on schematic
    const maxDim = Math.max(width, height, length);
    camera.position.set(maxDim * 1.2, maxDim * 1.0, maxDim * 1.2);
    controls.target.set(0, height/2, 0);
    controls.update();
    
    // Apply initial filter based on checkboxes
    updateVisibility();
  }
  
  function updateVisibility() {
    const showCheckpoints = document.getElementById('toggle-checkpoints')?.checked;
    const showElytra = document.getElementById('toggle-elytra')?.checked;
    const showElytraRemove = document.getElementById('toggle-elytra-remove')?.checked;
    const showReturn = document.getElementById('toggle-return')?.checked;
    const showStart = document.getElementById('toggle-start')?.checked;
    const showFinish = document.getElementById('toggle-finish')?.checked;
    
    // In a real implementation, we would toggle by block type
    // For now, just log
    console.log('Visibility:', { showCheckpoints, showElytra, showElytraRemove, showReturn, showStart, showFinish });
  }
  
  // Init viewer on load
  window.addEventListener('load', () => {
    // Load three.js and then init
    const script = document.createElement('script');
    script.type = 'importmap';
    document.head.appendChild(script);
    initViewer();
  });

  function hideAll(type) {
    console.log('Hide all', type);
    // Would toggle three.js scene visibility
    document.querySelectorAll('#toggle-checkpoints, #toggle-elytra, #toggle-elytra-remove, #toggle-return').forEach(cb => {
      if (cb.id.includes(type) || type === 'zone') cb.checked = false;
    });
  }

  function showAll(type) {
    console.log('Show all', type);
    document.querySelectorAll('#toggle-checkpoints, #toggle-elytra, #toggle-elytra-remove, #toggle-return').forEach(cb => cb.checked = true);
  }

  function hideBlockType(type) {
    console.log('Hide block type', type);
    // Would filter by material
  }

  function downloadSchematic() {
    const url = schematicUrl || (document.getElementById('schematic-status').textContent.includes('http') ? document.getElementById('schematic-status').textContent.split(' ').pop() : null);
    if (url && url.startsWith('http')) window.open(url, '_blank');
    else alert('No schematic URL');
  }

  function copyViewerLink() {
    navigator.clipboard.writeText(window.location.href).then(() => alert('Viewer link copied!'));
  }

  // Make checkboxes interactive
  document.addEventListener('change', (e) => {
    if (e.target.id && e.target.id.startsWith('toggle-')) {
      updateVisibility();
    }
  });

  // Handle viewer.html?schematic= URL decoding (shulkr links are double-encoded)
  // Ensure the URL is properly decoded
  window.addEventListener('DOMContentLoaded', () => {
