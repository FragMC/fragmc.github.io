name: GitHub Pages Deploy

on:
  push:
    branches:
      - main   # deploy main branch to root
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - main   # preview PRs targeting main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Determine if this is a PR with the label "PR Preview"
      - name: Check PR Label
        id: check_label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let deployPreview = false;
            if (context.eventName === 'pull_request') {
              const labels = context.payload.pull_request.labels.map(l => l.name);
              if (labels.includes('PR Preview')) {
                deployPreview = true;
              }
            }
            core.setOutput('deploy_preview', deployPreview);

      # Deploy main branch to root
      - name: Deploy Main to Root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./             # your HTML root folder
          destination_dir: ''         # root
          user_name: 'github-actions'
          user_email: 'github-actions@github.com'
          keep_files: true

      # Deploy PR preview to /pr-<PR_NUMBER>/
      - name: Deploy PR Preview
        if: steps.check_label.outputs.deploy_preview == 'true'
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./             # your HTML root folder
          destination_dir: pr-${{ github.event.pull_request.number }}
          user_name: 'github-actions'
          user_email: 'github-actions@github.com'
          keep_files: true

      # Comment PR preview URL
      - name: Comment PR Preview URL
        if: steps.check_label.outputs.deploy_preview == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const previewUrl = `https://${repoOwner}.github.io/${repoName}/pr-${prNumber}/`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: repoOwner,
              repo: repoName,
              issue_number: prNumber
            });

            const botComment = comments.find(c => c.body.includes('🚀 Preview site available here'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repoOwner,
                repo: repoName,
                comment_id: botComment.id,
                body: `🚀 Preview site updated: [${previewUrl}](${previewUrl})`
              });
            } else {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: `🚀 Preview site available here: [${previewUrl}](${previewUrl})`
              });
            }
